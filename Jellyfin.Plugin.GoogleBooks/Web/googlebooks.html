<div id="GoogleBooksConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-controller="__plugin/googlebooksjs">
    <div data-role="content">
        <div class="content-primary">
            <form id="GoogleBooksConfigForm">
                <div class="inputContainer">
                    <input is="emby-input" type="password" id="apiKey" label="Google Books API key" autocomplete="off" />
                    <div class="fieldDescription">
                        Required by Google for public Books API requests. Enable the Books API for your Google Cloud project and restrict the key to that API.
                    </div>
                </div>
                <div>
                    <button is="emby-button" type="submit" class="raised button-submit block">
                        <span>${Save}</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
